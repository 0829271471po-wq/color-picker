<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Color Picker | AyuTech Lab</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: #06111f;
    color: #eaf6ff;
}

.container {
    width: 90%;
    max-width: 600px;
}

/* CARD */
.card {
    background: #0a1b2e;
    border: 1px solid #173653;
    border-radius: 22px;
    padding: 30px;
    box-shadow: 0 20px 50px rgba(0,0,0,.25);
}

/* TITLE */
.logo {
    color: #55b9ff;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1px;
}

h1 {
    margin: 8px 0;
    font-size: 34px;
}

.subtitle {
    color: #829caf;
    margin-bottom: 25px;
}

/* COLOR PREVIEW */
.preview {
    width: 100%;
    height: 200px;
    border-radius: 16px;
    background: #55b9ff;
    border: 1px solid #234766;
    margin-bottom: 20px;
}

/* PICKER */
.picker-box {
    display: flex;
    align-items: center;
    gap: 15px;
    background: #071524;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #173653;
}

input[type="color"] {
    width: 60px;
    height: 50px;
    padding: 0;
    border: none;
    background: transparent;
    cursor: pointer;
}

/* VALUES */
.values {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 15px;
}

.value {
    background: #071524;
    border: 1px solid #173653;
    border-radius: 10px;
    padding: 14px;
    text-align: center;
}

.value span {
    display: block;
    color: #718ba0;
    font-size: 12px;
    margin-bottom: 7px;
}

.value b {
    color: #eaf6ff;
    font-size: 14px;
}

/* BUTTONS */
.buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

button {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
}

.copy {
    background: #2c9cff;
    color: white;
}

.random {
    background: #12395b;
    color: #72c7ff;
}

button:hover {
    opacity: .85;
}

/* MESSAGE */
.message {
    text-align: center;
    color: #8ee7d2;
    min-height: 20px;
    margin-top: 15px;
    font-size: 13px;
}

/* MOBILE */
@media(max-width: 600px) {

    .card {
        padding: 20px;
    }

    h1 {
        font-size: 28px;
    }

    .values {
        grid-template-columns: 1fr;
    }

    .preview {
        height: 160px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            AYUTECH LAB • MINI PROJECT
        </div>

        <h1>Color Picker</h1>

        <p class="subtitle">
            เลือกสีและดูค่า HEX, RGB และ HSL แบบ Real-time
        </p>


        <!-- COLOR PREVIEW -->
        <div
            class="preview"
            id="preview">
        </div>


        <!-- COLOR INPUT -->
        <div class="picker-box">

            <input
                type="color"
                id="colorPicker"
                value="#55b9ff">

            <div>
                <b>เลือกสีที่ต้องการ</b>

                <div
                    id="hexText"
                    style="color:#829caf;margin-top:5px;">
                    #55B9FF
                </div>
            </div>

        </div>


        <!-- COLOR VALUES -->
        <div class="values">

            <div class="value">
                <span>HEX</span>
                <b id="hex">#55B9FF</b>
            </div>

            <div class="value">
                <span>RGB</span>
                <b id="rgb">85, 185, 255</b>
            </div>

            <div class="value">
                <span>HSL</span>
                <b id="hsl">205°, 100%, 67%</b>
            </div>

        </div>


        <!-- BUTTONS -->
        <div class="buttons">

            <button
                class="copy"
                onclick="copyColor()">
                Copy HEX
            </button>

            <button
                class="random"
                onclick="randomColor()">
                Random Color
            </button>

        </div>


        <div
            class="message"
            id="message">
        </div>

    </div>

</div>


<script>

/* ELEMENTS */

const colorPicker =
    document.getElementById("colorPicker");

const preview =
    document.getElementById("preview");

const hex =
    document.getElementById("hex");

const rgb =
    document.getElementById("rgb");

const hsl =
    document.getElementById("hsl");

const hexText =
    document.getElementById("hexText");

const message =
    document.getElementById("message");


/* UPDATE COLOR */

function updateColor() {

    const color =
        colorPicker.value.toUpperCase();

    preview.style.background =
        color;

    hex.textContent =
        color;

    hexText.textContent =
        color;


    const rgbValue =
        hexToRGB(color);

    rgb.textContent =
        `${rgbValue.r}, ${rgbValue.g}, ${rgbValue.b}`;


    const hslValue =
        rgbToHSL(
            rgbValue.r,
            rgbValue.g,
            rgbValue.b
        );

    hsl.textContent =
        `${hslValue.h}°, ${hslValue.s}%, ${hslValue.l}%`;

}


/* HEX → RGB */

function hexToRGB(hex) {

    const value =
        hex.replace("#", "");

    return {

        r: parseInt(
            value.substring(0, 2),
            16
        ),

        g: parseInt(
            value.substring(2, 4),
            16
        ),

        b: parseInt(
            value.substring(4, 6),
            16
        )

    };

}


/* RGB → HSL */

function rgbToHSL(r, g, b) {

    r /= 255;
    g /= 255;
    b /= 255;

    const max =
        Math.max(r, g, b);

    const min =
        Math.min(r, g, b);

    let h;
    let s;

    const l =
        (max + min) / 2;


    if (max === min) {

        h = 0;
        s = 0;

    } else {

        const d =
            max - min;

        s =
            l > 0.5
                ? d / (2 - max - min)
                : d / (max + min);


        switch(max) {

            case r:

                h =
                    (g - b) / d +
                    (g < b ? 6 : 0);

                break;

            case g:

                h =
                    (b - r) / d + 2;

                break;

            case b:

                h =
                    (r - g) / d + 4;

                break;

        }

        h /= 6;
    }


    return {

        h: Math.round(h * 360),

        s: Math.round(s * 100),

        l: Math.round(l * 100)

    };

}


/* COPY */

function copyColor() {

    navigator.clipboard.writeText(
        colorPicker.value.toUpperCase()
    );

    message.textContent =
        "คัดลอก HEX แล้ว ✓";

    setTimeout(function() {

        message.textContent = "";

    }, 1500);

}


/* RANDOM COLOR */

function randomColor() {

    const letters =
        "0123456789ABCDEF";

    let color = "#";

    for(let i = 0; i < 6; i++) {

        color +=
            letters[
                Math.floor(
                    Math.random() *
                    16
                )
            ];

    }

    colorPicker.value =
        color;

    updateColor();

}


/* CHANGE COLOR */

colorPicker.addEventListener(
    "input",
    updateColor
);


/* START */

updateColor();

</script>

</body>
</html>
